name: Qwen Harness Dispatch Health

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  issues: read
  contents: read

jobs:
  queue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { data } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'harness:ready',
              per_page: 100
            });
            core.summary.addHeading('Qwen Harness queue').addRaw(`${data.length} ready issue(s); persistent host workers poll this repository.`).write();
