name: Qwen Harness CI

on:
  pull_request:
  push:
    branches: ["{{DEFAULT_BRANCH}}"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qwen-harness-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Qwen Harness / CI
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Bootstrap detected project
        run: node .qwen-harness/scripts/bootstrap.mjs
      - name: Run configured gates
        run: node .qwen-harness/scripts/run-gates.mjs
