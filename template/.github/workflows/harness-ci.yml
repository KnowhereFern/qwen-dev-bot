name: Qwen Harness CI

on:
  pull_request:
  push:
    branches: ["{{DEFAULT_BRANCH}}"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qwen-harness-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Qwen Harness / CI
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Bootstrap detected project
        run: node .qwen-harness/scripts/bootstrap.mjs
      - name: Run configured gates
        run: node .qwen-harness/scripts/run-gates.mjs
