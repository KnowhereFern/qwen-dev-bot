name: Qwen Harness Intake

on:
  issues:
    types: [labeled]

permissions:
  issues: write
  contents: read

jobs:
  acknowledge:
    if: github.event.label.name == 'harness:accept'
    runs-on: ubuntu-latest
    steps:
      - name: Record intake handoff
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'Accepted for bounded Qwen normalization. The persistent worker will create a separate executable issue; this raw issue will never be executed directly.'
            });
